name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', extensions: mbstring, intl, pdo_mysql, pdo_pgsql, bcmath, coverage: none }
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: find app core config bin migrations tests public -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { db: [mysql, pgsql] }
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: php_docflow_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: root, POSTGRES_PASSWORD: postgres, POSTGRES_DB: php_docflow_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U root -d php_docflow_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_DRIVER: ${{ matrix.db == 'mysql' && 'mysql' || 'pgsql' }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      DB_NAME: php_docflow_test
      DB_USER: root
      DB_PASS: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.5', extensions: mbstring, intl, pdo_mysql, pdo_pgsql, bcmath, coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite Unit
      - run: vendor/bin/phpunit --testsuite Integration

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: PUPPETEER_SKIP_DOWNLOAD=true npm ci
      - run: npm run build
      - run: git diff --exit-code -- public/assets/css/tailwind.css public/assets/vendor